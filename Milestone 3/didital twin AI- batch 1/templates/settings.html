{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4><i class="fas fa-palette me-2"></i>Theme Settings</h4>
                    <p class="text-muted">Choose your preferred appearance.</p>
                    <hr>
                    <div class="d-flex gap-3">
                        <button class="btn btn-outline-secondary" onclick="setTheme('light')">
                            <i class="fas fa-sun me-2"></i> Light
                        </button>
                        <button class="btn btn-outline-secondary" onclick="setTheme('dark')">
                            <i class="fas fa-moon me-2"></i> Dark
                        </button>
                    </div>
                    <small class="text-muted">Your preference is saved automatically.</small>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        // Update navbar toggle icon
        const toggleIcon = document.querySelector('#themeToggle i');
        if (toggleIcon) {
            toggleIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        // Show feedback
        const btn = event.target.closest('button');
        if (btn) {
            btn.innerHTML = '<i class="fas fa-check me-2"></i> ' + theme.charAt(0).toUpperCase() + theme.slice(1) + ' (active)';
            btn.className = 'btn btn-success';
            setTimeout(() => {
                btn.className = 'btn btn-outline-secondary';
                btn.innerHTML = theme === 'light' ? '<i class="fas fa-sun me-2"></i> Light' : '<i class="fas fa-moon me-2"></i> Dark';
            }, 1500);
        }
    }
</script>
{% endblock %}
